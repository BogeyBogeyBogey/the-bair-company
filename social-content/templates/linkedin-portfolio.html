<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LinkedIn — Portfolio Showcase</title>
  <link rel="stylesheet" href="shared.css">
  <script>
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    // ✏️ WIJZIG HIER JE CONTENT:
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    const CONTENT = {
      heading: "Nieuw project live:\nStudio Bloom",
      body: "Van eerste gesprek tot lancering in 4 weken. Een website die voelt als hun merk — warm, premium en resultaatgericht.",
      screenshot: "",  // Pad naar screenshot, bv: "screenshots/studio-bloom.png"
    };
  </script>
  <style>
    .canvas { background: var(--noir-elevated); display: flex; }
    .li-left { width: 660px; height: 628px; position: relative; overflow: hidden; flex-shrink: 0; }
    .li-left img { width: 100%; height: 100%; object-fit: cover; filter: grayscale(100%) contrast(1.05); }
    .li-left-placeholder { width: 100%; height: 100%; background: var(--noir-surface); display: flex; align-items: center; justify-content: center; color: var(--text-dim); font-family: var(--font-mono); font-size: 13px; position: relative; }
    .li-left-placeholder::before { content: ''; position: absolute; inset: 0; background-image: linear-gradient(var(--noir-line-subtle) 1px, transparent 1px), linear-gradient(90deg, var(--noir-line-subtle) 1px, transparent 1px); background-size: 48px 48px; opacity: 0.2; }
    .li-divider { width: 1px; background: var(--noir-line); flex-shrink: 0; }
    .li-right { flex: 1; padding: 48px; display: flex; flex-direction: column; justify-content: center; position: relative; }
    .li-heading { font-family: var(--font-display); font-weight: 700; font-size: 24px; line-height: 1.2; color: var(--text-primary); white-space: pre-line; }
    .li-body { font-family: var(--font-body); font-weight: 300; font-size: 14px; line-height: 1.6; color: var(--text-secondary); margin-top: 12px; max-width: 400px; }
    .li-logo { position: absolute; bottom: 48px; right: 48px; width: 20px; height: auto; filter: brightness(0) invert(1); opacity: 0.3; }
  </style>
</head>
<body>
  <div class="canvas canvas-linkedin">
    <div class="li-left" id="imageArea">
      <div class="li-left-placeholder">Screenshot hier</div>
    </div>
    <div class="li-divider"></div>
    <div class="li-right">
      <h2 class="li-heading" id="heading"></h2>
      <p class="li-body" id="body"></p>
      <img src="logo.png" alt="B" class="li-logo">
    </div>
  </div>
  <script>
    document.getElementById('heading').textContent = CONTENT.heading;
    document.getElementById('body').textContent = CONTENT.body;
    if (CONTENT.screenshot) {
      document.getElementById('imageArea').innerHTML = '<img src="' + CONTENT.screenshot + '" alt="Project">';
    }
  </script>
</body>
</html>
