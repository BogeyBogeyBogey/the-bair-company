<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LinkedIn — Thought Leadership (Bone)</title>
  <link rel="stylesheet" href="shared.css">
  <script>
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    // ✏️ WIJZIG HIER JE CONTENT:
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    const CONTENT = {
      quote: "De beste websites zijn onzichtbaar. Je merkt het design niet — je voelt het vertrouwen.",
      authorName: "Kristof Bogaerts",
      authorRole: "The Bair Co.",
    };
  </script>
  <style>
    .canvas { background: var(--bone-base); display: flex; align-items: center; justify-content: center; position: relative; }
    .thought-content { padding: 0 80px; max-width: 100%; }
    .thought-quote { font-family: var(--font-display); font-weight: 700; font-size: 28px; line-height: 1.3; color: var(--text-on-bone); max-width: 800px; padding-left: 64px; position: relative; }
    .thought-quote::before { content: ''; position: absolute; left: 0; top: 6px; width: 1px; height: 60px; background: var(--bone-line); }
    .thought-author { position: absolute; bottom: 48px; right: 80px; display: flex; align-items: center; gap: 12px; }
    .thought-author-text { text-align: right; }
    .thought-author-name { font-family: var(--font-body); font-weight: 400; font-size: 14px; color: var(--text-on-bone-muted); }
    .thought-author-role { font-family: var(--font-body); font-weight: 300; font-size: 12px; color: var(--text-on-bone-muted); margin-top: 2px; }
    .thought-logo { width: 20px; height: auto; filter: brightness(0); opacity: 0.7; }
  </style>
</head>
<body>
  <div class="canvas canvas-linkedin canvas--bone">
    <div class="thought-content">
      <p class="thought-quote" id="quote"></p>
    </div>
    <div class="thought-author">
      <div class="thought-author-text">
        <div class="thought-author-name" id="authorName"></div>
        <div class="thought-author-role" id="authorRole"></div>
      </div>
      <img src="logo.png" alt="B" class="thought-logo">
    </div>
  </div>
  <script>
    document.getElementById('quote').textContent = CONTENT.quote;
    document.getElementById('authorName').textContent = '— ' + CONTENT.authorName;
    document.getElementById('authorRole').textContent = CONTENT.authorRole;
  </script>
</body>
</html>
