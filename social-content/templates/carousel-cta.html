<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carousel — Slide 10: CTA</title>
  <link rel="stylesheet" href="shared.css">
  <script>
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    // ✏️ WIJZIG HIER JE CONTENT:
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    const CONTENT = {
      companyName: "The Bair Co.",
      tagline: "Merken die blijven hangen.",
      buttonText: "Neem contact op",
      url: "baircompany.be",
    };
  </script>
  <style>
    .canvas { background: var(--noir-base); display: flex; align-items: center; justify-content: center; }
    .cta-content { display: flex; flex-direction: column; align-items: center; }
    .cta-logo { width: 48px; height: auto; filter: brightness(0) invert(1); margin-bottom: 40px; }
    .cta-company { font-family: var(--font-display); font-weight: 700; font-size: 16px; letter-spacing: 0.3em; text-transform: uppercase; color: var(--text-primary); }
    .cta-tagline { font-family: var(--font-serif); font-style: italic; font-size: 20px; color: var(--text-secondary); margin-top: 12px; }
    .cta-button { margin-top: 48px; }
    .cta-url { font-family: var(--font-mono); font-weight: 400; font-size: 13px; color: var(--text-dim); margin-top: 24px; }
  </style>
</head>
<body>
  <div class="canvas canvas-carousel">
    <div class="cta-content">
      <img src="logo.png" alt="Logo" class="cta-logo">
      <span class="cta-company" id="company"></span>
      <span class="cta-tagline" id="tagline"></span>
      <div class="cta-button">
        <span class="ghost-btn" id="btn"></span>
      </div>
      <span class="cta-url" id="url"></span>
    </div>
  </div>
  <script>
    document.getElementById('company').textContent = CONTENT.companyName;
    document.getElementById('tagline').textContent = CONTENT.tagline;
    document.getElementById('btn').textContent = CONTENT.buttonText;
    document.getElementById('url').textContent = CONTENT.url;
  </script>
</body>
</html>
