<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Story — Portfolio Tease</title>
  <link rel="stylesheet" href="shared.css">
  <script>
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    // ✏️ WIJZIG HIER JE CONTENT:
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    const CONTENT = {
      title: "Bakkerij Verboven",
      linkText: "Bekijk het project →",
      screenshot: "",  // Pad naar screenshot, bv: "screenshots/project.jpg"
    };
  </script>
  <style>
    .canvas {
      background: var(--noir-base);
    }

    .story-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: grayscale(100%) contrast(1.1) brightness(0.85);
      z-index: 0;
    }

    .story-bg-placeholder {
      position: absolute;
      inset: 0;
      background: linear-gradient(160deg, var(--noir-surface) 0%, var(--noir-elevated) 40%, var(--noir-surface) 100%);
      z-index: 0;
    }

    .story-bg-placeholder::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(var(--noir-line-subtle) 1px, transparent 1px),
        linear-gradient(90deg, var(--noir-line-subtle) 1px, transparent 1px);
      background-size: 60px 60px;
      opacity: 0.12;
    }

    .story-gradient {
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, transparent 55%, rgba(10, 10, 10, 0.95) 80%);
      z-index: 1;
    }

    .story-logo-top {
      position: absolute;
      top: 80px;
      left: 60px;
      width: 20px;
      height: auto;
      filter: brightness(0) invert(1);
      opacity: 0.3;
      z-index: 3;
    }

    .story-text {
      position: absolute;
      bottom: 120px;
      left: 60px;
      right: 60px;
      z-index: 2;
    }

    .story-title {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 28px;
      color: var(--text-primary);
      margin-bottom: 8px;
    }

    .story-link {
      font-family: var(--font-body);
      font-weight: 300;
      font-size: 14px;
      color: var(--text-secondary);
    }
  </style>
</head>
<body>
  <div class="canvas canvas-story">

    <div class="story-bg-placeholder" id="imageArea">
    </div>

    <div class="story-gradient"></div>

    <img src="logo.png" alt="B" class="story-logo-top">

    <div class="story-text">
      <h2 class="story-title" id="title"></h2>
      <p class="story-link" id="linkText"></p>
    </div>

  </div>
  <script>
    document.getElementById('title').textContent = CONTENT.title;
    document.getElementById('linkText').textContent = CONTENT.linkText;
    if (CONTENT.screenshot) {
      document.getElementById('imageArea').outerHTML = '<img src="' + CONTENT.screenshot + '" alt="Project" class="story-bg">';
    }
  </script>
</body>
</html>
