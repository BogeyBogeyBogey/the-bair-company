<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LinkedIn — Metric/Insight</title>
  <link rel="stylesheet" href="shared.css">
  <script>
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    // ✏️ WIJZIG HIER JE CONTENT:
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    const CONTENT = {
      metric: "+127%",
      label: "organisch verkeer\nna de redesign",
    };
  </script>
  <style>
    .canvas { background: var(--noir-base); display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }
    .lm-metric { font-family: var(--font-mono); font-weight: 400; font-size: 64px; color: var(--text-primary); letter-spacing: -0.02em; text-align: center; }
    .lm-label { font-family: var(--font-body); font-weight: 300; font-size: 18px; color: var(--text-secondary); text-align: center; margin-top: 8px; white-space: pre-line; }
    .lm-logo { position: absolute; bottom: 40px; right: 48px; width: 20px; height: auto; filter: brightness(0) invert(1); opacity: 0.3; }
  </style>
</head>
<body>
  <div class="canvas canvas-linkedin">
    <div class="lm-metric" id="metric"></div>
    <div class="lm-label" id="label"></div>
    <img src="logo.png" alt="B" class="lm-logo">
  </div>
  <script>
    document.getElementById('metric').textContent = CONTENT.metric;
    document.getElementById('label').textContent = CONTENT.label;
  </script>
</body>
</html>
